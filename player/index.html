<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe8" />
  <title>难题动起来</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c4372c'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff7ee' font-family='Songti SC,serif' font-weight='700'%3E%E5%8A%A8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="拖动调整左右两栏宽度，双击恢复" title="拖动调整宽度，双击恢复"></div>
    <header class="bar">
      <div class="brand"><span class="seal" aria-hidden="true">动</span><h1>难题动起来</h1></div>
      <button id="libBtn" class="lib-btn" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.5L13 5v8.5H3z M10.5 2.5V5H13 M5.5 8h5 M5.5 10.5h5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg><span id="libName">选一道题</span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="addBtn" class="primary"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>放题进来</span></button>
    </header>

    <main class="stage" aria-label="运动过程">
      <div class="stage-head">
      <div class="toolbar">
        <details id="noAnimation" class="no-animation" hidden><summary>这道题没有动画</summary><span id="noAnimationReason"></span></details>
        <span id="nowText" class="now"><span id="nowStep" hidden></span><span id="nowMessage"></span></span><span id="keyHint" hidden></span>
        <details id="lettersNote" class="letters-note" hidden><summary>字母题 · 画面里的数是示例</summary><p>题目没有给数，下面的数是为了能演示随便取的，答案以式子为准。</p></details>
        <div class="tb-right">
          <div class="chips" id="sceneOptions" role="group" aria-label="画面上显示">
            <label class="chip"><input type="checkbox" id="velocityToggle" checked /><i class="dot blue"></i>速度</label>
            <label class="chip"><input type="checkbox" id="forceToggle" /><i class="dot amber"></i>受力</label>
            <label class="chip"><input type="checkbox" id="trailToggle" checked /><i class="dot gray"></i>轨迹</label>
            <label class="chip" title="所求物体旁边的结构太小时，在角上放大那一块"><input type="checkbox" id="insetToggle" /><i class="dot purple"></i>放大镜</label>
            <label class="chip" id="predictChip" title="有预测题的小问：先选一个预测，再看动画"><input type="checkbox" id="predictToggle" /><i class="dot red"></i>先预测</label>
          </div>
          <div class="seg" id="altSeg" role="group" aria-label="画法" hidden><button data-alt="real">实物</button><button data-alt="plan">电路图</button></div>
          <div class="tools">
            <button id="chartBtn" class="tool" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5v11h11 M4.5 10.5l3-3.5 2.5 2 3.5-4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>图像</span></button>
            <button id="tryBtn" class="tool" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7 M12.5 4.5h1 M2.5 11.5h2 M7.5 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>改条件</span></button>
          </div>
        </div>
      </div>
      <p id="forceScaleNote" class="force-scale-note" hidden>短箭头长度为示意，其余受力箭头按同一比例；合并标注列出了施力物体。</p>
      <div id="repairGuide" class="repair-guide" hidden><span>讲解已经可以看了。想让它动起来：把修改提示发回给 AI，再把新回复粘贴进来。</span><div><button id="copyRepair">复制修改提示</button><button id="replaceReply">粘贴新回复</button></div><p id="repairAttemptNotice" hidden></p></div>
      </div>
      <div id="scene">
        <div id="lessonImage" class="lesson-image" hidden><img alt="题目截图" hidden /><label class="image-empty"><input type="file" accept="image/*" hidden />把题目截图放到这里，对照着看讲解</label><button class="image-reset" hidden>复位题图</button></div>
        <div id="sceneLoading" class="scene-loading" hidden><span class="spin"></span><strong>正在计算这道题</strong><span>只有第一次需要等，算完会记住</span></div>
        <div id="callout" class="callout" hidden></div>
        <div id="readout" class="readout" hidden></div>
        <details id="sceneNote" class="scene-note"><summary aria-label="立体画面说明">ⓘ</summary><span></span></details>
        <div id="camBar" class="cam-bar" role="group" aria-label="画面缩放" hidden>
          <button id="dimToggle" class="txt dim-toggle" aria-pressed="false" title="切到立体画面，可以拖动旋转" hidden><i class="sw" aria-hidden="true"></i>立体</button>
          <span class="view-controls dim-seg" role="group" aria-label="视角" hidden><button data-view="front" class="txt" title="正对运动平面，角度不变形">正视</button><button data-view="angle" class="txt">斜视</button><button data-view="top" class="txt">俯视</button></span>
          <button data-cam="in" title="放大（也可以滚轮或双指）" aria-label="放大"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button data-cam="out" title="缩小" aria-label="缩小"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button data-cam="wide" class="txt" title="看这一问的整段运动，不推近跟随" aria-pressed="false">全景</button>
          <button data-cam="reset" class="txt" title="回到自动取景">复位</button>
        </div>
      </div>
      <div id="panel" class="panel">
        <section id="chartCard" class="chart-card"><svg id="chart" aria-label="物理量随时间变化的图" role="img"></svg></section>
        <section id="tryCard" class="try-card" hidden><header><h3>改条件试试</h3><span class="hint" id="tryHint">松手后重算</span><button id="tryReset" class="link" hidden>恢复原题</button><p id="tryMsg"></p></header><div id="tryPanel"></div></section>
      </div>
      <div class="dock">
        <button id="play" class="play" aria-label="播放" disabled></button>
        <div class="evnav" role="group" aria-label="跳到转折点"><button id="evPrev" title="上一个转折点（相碰、共速、离开……）" aria-label="上一个转折点"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3.5v9M12 3.5 6.5 8l5.5 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button><button id="evNext" title="下一个转折点" aria-label="下一个转折点"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3.5v9M4 3.5 9.5 8 4 12.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button></div>
        <div class="timeline"><div id="track" class="track"></div><div class="rail"></div><div id="fill" class="fill"></div><div id="ticks" class="ticks"></div><span id="keyMark" class="key-mark" hidden></span><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="拖动时间" disabled /></div>
        <span id="clock" class="clock"></span>
        <button id="speedBtn" class="seg speed" data-speed="1" aria-label="播放速度：中，点击切换">中</button>
      </div>
    </main>

    <aside class="sheet" aria-label="题目和讲解">
      <nav class="qnav" aria-label="小问"><button id="paperBtn" class="qpill" role="tab">题目</button><button id="allBtn" class="qpill all">全过程</button><div id="qs" class="qs" role="tablist"></div></nav>
      <div id="verdict" class="verdict"></div>
      <div class="sheet-scroll" id="sheetScroll">
        <button id="paperToggle" class="paper-toggle" aria-controls="paper" aria-expanded="false" hidden><b>题干</b><span id="stemPreview" class="paper-preview"></span><span id="paperAction">展开</span></button>
        <section id="paper" class="problem">
          <p id="source" class="source"></p>
          <div id="figure" class="figure" hidden></div>
          <div id="stem" class="stem"></div>
          <div id="options" class="paper-options"></div>
          <div id="model" class="model" hidden></div>
          <details id="knownBox" class="known"><summary>已知条件</summary><table id="known"></table></details>
        </section>
        <div id="idea" class="idea" hidden></div>
        <section id="lesson" class="lesson" aria-live="polite"></section>
      </div>
      <footer id="caption" class="lesson-nav"></footer>
    </aside>
  </div>

  <div id="libBox" class="overlay" hidden><section class="dialog library" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <header><h2 id="libTitle">题库</h2><button id="libClose" class="close" aria-label="关闭"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header>
    <div id="libTools" class="lib-tools"></div>
    <div id="libList" class="lib-list"></div>
  </section></div>
  <div id="pasteBox" class="overlay" hidden><section class="dialog paste-dialog" role="dialog" aria-modal="true" aria-labelledby="pasteTitle">
    <header><h2 id="pasteTitle">放一道题进来</h2><button id="pasteClose" class="close" aria-label="关闭"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header>
    <div class="paste-body" id="pasteBody"><ol class="steps">
      <li><b>放上题目截图</b><p class="paste-tip">建议放，看讲解时能对照；也可以跳过。</p><label id="drop" class="drop"><input type="file" id="imageFile" accept="image/*" hidden /><span id="dropText">点这里选图片，或直接粘贴截图</span><img id="dropImg" alt="题目截图" hidden /></label><button id="pasteNew" class="link" hidden>重新放一道题</button></li>
      <li><b>复制提示词，连同截图和答案发给你的 AI</b><div id="topics" class="topics"></div><button id="copyPrompt">复制提示词</button></li>
      <li><b>把 AI 的整段回复粘贴到这里</b><div id="pasteErr" class="paste-error" role="alert" hidden></div><textarea id="pasteText" rows="6" aria-label="AI 回复" placeholder="在这里粘贴 AI 的回复" spellcheck="false"></textarea></li>
    </ol></div>
    <footer><span>全部在你的浏览器里计算</span><button id="pasteRun" class="primary">开始演示</button></footer>
  </section></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
